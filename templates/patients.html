<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patients - Clinic Appointment System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        nav {
            background: #1976d2;
            padding: 15px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1976d2;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca8;
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            🏥 Clinic Appointment System
        </div>

        <div class="nav-links">

            <a href="/">🏠 Home</a>

            <a href="/dashboard">📊 Dashboard</a>

            <a href="/patients">👤 Patients</a>

            <a href="/doctors">🧑‍⚕️ Doctors</a>

            <a href="/appointments">📅 Appointments</a>

        </div>

    </nav>

    <div class="container">

        <h1>Patient Registration</h1>

        <form action="/add_patient" method="POST">

            <label for="name">Patient Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter patient name"
                required
            >

            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter phone number"
                required
            >

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email address"
            >

            <button type="submit">
                Register Patient
            </button>

        </form>

    </div>

</body>

</html>
