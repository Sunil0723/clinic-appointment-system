<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        header {
            background: #1976d2;
            color: white;
            padding: 20px 8%;
        }

        header h2 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1976d2;
            margin-bottom: 25px;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca8;
        }
    </style>
</head>

<body>

<header>
    <h2>Clinic Appointment System</h2>
</header>

<div class="container">

    <h1>Patient Registration</h1>

    <form>

        <label>Patient Name</label>
        <input type="text" name="name" placeholder="Enter patient name" required>

        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="Enter phone number" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter email address">

        <button type="submit">Register Patient</button>

    </form>

</div>

</body>
</html>
