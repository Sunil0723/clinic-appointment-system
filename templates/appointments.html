<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Appointment</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        nav {
            background: #1976d2;
            padding: 15px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1976d2;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca8;
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            🏥 Clinic Appointment System
        </div>

        <div class="nav-links">

            <a href="/">🏠 Home</a>

            <a href="/dashboard">📊 Dashboard</a>

            <a href="/patients">👤 Patients</a>

            <a href="/doctors">🧑‍⚕️ Doctors</a>

            <a href="/appointments">📅 Appointments</a>

        </div>

    </nav>


    <div class="container">

        <h1>Book Appointment</h1>

        <form action="/book_appointment" method="POST">

            <label for="patient_id">Patient</label>

            <select id="patient_id" name="patient_id" required>

                <option value="">Select Patient</option>

                {% for patient in patients %}

                    <option value="{{ patient.id }}">
                        {{ patient.name }}
                    </option>

                {% endfor %}

            </select>


            <label for="doctor_id">Doctor</label>

            <select id="doctor_id" name="doctor_id" required>

                <option value="">Select Doctor</option>

                {% for doctor in doctors %}

                    <option value="{{ doctor.id }}">
                        Dr. {{ doctor.name }} - {{ doctor.specialization }}
                    </option>

                {% endfor %}

            </select>


            <label for="appointment_date">
                Appointment Date
            </label>

            <input
                type="date"
                id="appointment_date"
                name="appointment_date"
                required
            >


            <label for="appointment_time">
                Appointment Time
            </label>

            <input
                type="time"
                id="appointment_time"
                name="appointment_time"
                required
            >


            <button type="submit">
                Book Appointment
            </button>

        </form>

    </div>

</body>

</html>
