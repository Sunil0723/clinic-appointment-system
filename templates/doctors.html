<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        header {
            background: #1976d2;
            color: white;
            padding: 20px 8%;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1976d2;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca8;
        }
    </style>
</head>

<body>

<nav style="
    background: #1976d2;
    padding: 15px 8%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
">

    <div style="
        color: white;
        font-size: 20px;
        font-weight: bold;
    ">
        🏥 Clinic Appointment System
    </div>

    <div style="
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    ">

        <a href="/"
           style="color: white; text-decoration: none; padding: 8px 12px;">
            🏠 Home
        </a>

        <a href="/dashboard"
           style="color: white; text-decoration: none; padding: 8px 12px;">
            📊 Dashboard
        </a>

        <a href="/patients"
           style="color: white; text-decoration: none; padding: 8px 12px;">
            👤 Patients
        </a>

        <a href="/doctors"
           style="color: white; text-decoration: none; padding: 8px 12px;">
            🧑‍⚕️ Doctors
        </a>

        <a href="/appointments"
           style="color: white; text-decoration: none; padding: 8px 12px;">
            📅 Appointments
        </a>

    </div>

</nav>

<div class="container">

    <h1>Doctor Management</h1>

    <form action="/add_doctor" method="POST">

        <label>Doctor Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter doctor name"
            required
        >

        <label>Specialization</label>

        <input
            type="text"
            name="specialization"
            placeholder="Enter specialization"
            required
        >

        <button type="submit">Add Doctor</button>

    </form>

</div>

</body>
</html>
