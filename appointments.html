<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Appointment</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        header {
            background: #1976d2;
            color: white;
            padding: 20px 8%;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1976d2;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca8;
        }
    </style>
</head>

<body>

<header>
    <h2>Clinic Appointment System</h2>
</header>

<div class="container">

    <h1>Book Appointment</h1>

    <form action="/book_appointment" method="POST">

        <label>Patient</label>
        <select name="patient_id" required>
    <option value="">Select Patient</option>

    {% for patient in patients %}
        <option value="{{ patient.id }}">
            {{ patient.name }}
        </option>
    {% endfor %}
</select>

        <label>Doctor</label>
        <select name="doctor_id" required>
    <option value="">Select Doctor</option>

    {% for doctor in doctors %}
        <option value="{{ doctor.id }}">
            Dr. {{ doctor.name }} - {{ doctor.specialization }}
        </option>
    {% endfor %}
</select>

        <label>Appointment Date</label>
        <input type="date" name="appointment_date" required>

        <label>Appointment Time</label>
        <input type="time" name="appointment_time" required>

        <button type="submit">Book Appointment</button>

    </form>

</div>

</body>
</html>
